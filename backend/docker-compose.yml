# Lancement local. La production (reverse proxy TLS, secrets) viendra en phase 7.
services:
  backend:
    build: .
    env_file: .env
    environment:
      LBL_CONFIG: /config/demarches.yaml
    volumes:
      - ./demarches.yaml:/config/demarches.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"     # jamais exposé hors de la machine sans reverse proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
